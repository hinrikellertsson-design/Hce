name: Deploy MK 30 ára síðu

on:
  push:
    branches:
      - main
      - claude/artifact-session-furvf3
    paths:
      - "microsites/mk-30-ara/**"
      - ".github/workflows/mk-30-ara-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-mk-30-ara
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: microsites/mk-30-ara
      - id: deployment
        uses: actions/deploy-pages@v4
